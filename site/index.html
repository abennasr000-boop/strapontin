<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Instrument+Serif:ital@0;1&family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout concept: a grid sheet. Sage paper, hairline cells, wide serif capitals, one italic word, small extended sans labels. The home page is a gallery of posters with filters on top. Mobile first. Single committed look. */
:root{
  --paper:#D8D9CC; --paper-2:#E5E6DB; --paper-3:#CBCDBE;
  --ink:#231417; --ink-2:#403736; --line:rgba(35,20,23,.3);
  --accent:#9C2B0B; --accent-2:#7E2309; --accent-t:#6B1E07; --blue:#90ADBF; --wine:#3F1921; --green:#473803;
  --display:"Playfair Display","Didot","Bodoni 72",Georgia,serif;
  --italic:"Instrument Serif","Playfair Display",Georgia,serif;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --hh:58px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 70px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 2px #F6F6EF}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.08;margin:0;text-transform:uppercase;letter-spacing:.025em;text-wrap:balance}
h1 em,h2 em,h3 em,.it{font:italic 400 1.12em/1 var(--italic);text-transform:none;letter-spacing:0}
p{margin:0}
.wrap{max-width:1320px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:760px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.lab{font:500 11.5px/1.4 var(--sans);font-stretch:118%;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:10px 16px;z-index:100}
.skip:focus{left:16px}

/* header */
#chrome{display:contents}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.hd-row{display:flex;align-items:center;gap:18px;min-height:57px}
.logo{display:flex;align-items:center;gap:10px;font:600 17px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;flex:none}
.logo span{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--ink);border-radius:7px}
.logo svg{width:17px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.logo .flap{transition:transform .5s var(--ease);transform-origin:9.3px 20px}
.logo:hover .flap{transform:rotate(38deg)}
.nav{display:flex;gap:22px;flex:none}
.nav a{text-decoration:none;padding:6px 0;border-bottom:1px solid transparent}
.nav a:hover,.nav a[aria-current=page]{border-bottom-color:var(--ink);color:var(--ink)}
.search{position:relative;flex:1;min-width:0;max-width:420px;margin-left:auto}
.search input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 6px 8px 28px;font-size:15px}
.search input:focus{outline:0;border-bottom-color:var(--ink)}
.search input::placeholder{color:var(--ink-2)}
.search>svg{position:absolute;left:2px;top:50%;translate:0 -50%;width:16px;height:16px;pointer-events:none}
.ac{position:absolute;left:0;right:0;top:calc(100% + 1px);background:var(--paper-2);border:1px solid var(--ink);padding:6px;max-height:min(70vh,440px);overflow:auto;z-index:5}
.ac .acg{margin:8px 8px 2px}
.ac a{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px;text-decoration:none;font-weight:500}
.ac a small{color:var(--ink-2);font-weight:400;text-align:right}
.ac a[aria-selected=true],.ac a:hover{background:var(--paper-3)}
.ac mark{background:none;color:var(--accent-t);font-weight:700}
.ac .none{padding:12px 8px;color:var(--ink-2)}
.tools{display:flex;align-items:center;gap:14px;flex:none}
.tbtn{background:none;border:0;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
.tbtn b{color:var(--accent-t)}
.lang{display:flex;gap:8px}
.lang button{border:0;background:none;padding:6px 0;color:var(--ink-2)}
.lang button[aria-pressed=true]{color:var(--ink);border-bottom:1px solid var(--ink)}
.sbtn{display:none;background:none;border:0;padding:6px 2px}
.tabbar{display:none}
@media(max-width:820px){.hd-row{flex-wrap:wrap;gap:0 14px}.logo{margin-right:auto}.hd .nav,.hd .tbtn{display:none}.sbtn{display:inline-flex}.search{display:none;order:5;flex-basis:100%;max-width:none;margin:0 0 8px}.hd.so .search{display:block}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--paper);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a,.tabbar button{display:grid;place-items:center;min-height:54px;padding:6px 2px;text-decoration:none;background:none;border:0;text-align:center;color:var(--ink-2)}
.tabbar [aria-current=page]{color:var(--ink);font-weight:700;box-shadow:inset 0 2px 0 var(--ink)}
.tabbar b{color:var(--accent)}
body{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}.optin{bottom:calc(55px + env(safe-area-inset-bottom,0px))}.toast{bottom:calc(74px + env(safe-area-inset-bottom,0px))}footer .wrap{padding-bottom:40px}}

/* actions */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper-2);border:1px solid var(--ink);border-radius:2px;padding:13px 20px;font:600 12px var(--sans);font-stretch:118%;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:background .2s,color .2s,transform .2s var(--ease)}
.btn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#FBF7F0}
.btn.go:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.btn.sm{padding:9px 14px;font-size:11.5px}
.btn[disabled]{opacity:.35;pointer-events:none}
.tag{display:inline-flex;align-items:center;font:600 11px/1 var(--sans);font-stretch:112%;letter-spacing:.07em;text-transform:uppercase;padding:4px 6px;border:1px solid var(--line);border-radius:2px;white-space:nowrap}
.tag.vo{background:var(--blue);border-color:transparent}
.tag.en{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.tag.kind{border-color:var(--wine);color:var(--wine)}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.award{font:italic 400 18px/1.25 var(--italic);color:var(--green)}
.chips{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chips button,.fsel,.vt button{flex:none;background:transparent;border:0;border-bottom:1.5px solid transparent;border-radius:0;padding:10px 0 7px;font:500 14px var(--sans);white-space:nowrap;color:var(--ink-2);transition:color .2s,border-color .2s}
.chips button:hover,.vt button:hover{color:var(--ink)}
.chips button[aria-pressed=true],.vt button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:650}
.fsel{appearance:none;color:var(--ink);padding-right:18px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 6px) 55%,calc(100% - 1px) 55%;background-size:5px 5px;background-repeat:no-repeat;max-width:100%;text-overflow:ellipsis}
.fsel.on{border-bottom-color:var(--ink);font-weight:650}
.check{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.check input{width:17px;height:17px;accent-color:var(--accent)}

/* ticket */
.tk{display:inline-flex;align-items:stretch;background:var(--paper-2);border:1px solid var(--ink);border-radius:2px;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s;flex:none;position:relative}
.tk-main{padding:7px 12px;display:grid;align-content:center;min-width:88px}
.tk-time{font:700 18px/1.2 var(--sans);font-variant-numeric:tabular-nums}
.tk-sub{font-size:12.5px;line-height:1.3;color:var(--ink-2);white-space:nowrap}
.tk-stub{padding:7px 12px;border-left:1px dashed var(--ink);display:grid;align-content:center;justify-items:center;transition:transform .3s var(--ease),background .2s,color .2s;transform-origin:0 100%;background:var(--paper-2)}
.tk-price{font:500 13px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.tk-cta{font:700 10.5px var(--sans);font-stretch:118%;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-t);white-space:nowrap}
a.tk:hover{transform:translateY(-2px);box-shadow:0 10px 16px -12px rgba(35,20,23,.7)}
a.tk:hover .tk-stub{background:var(--accent);color:#FBF7F0;transform:rotate(5deg) translate(2px,-1px)}
a.tk:hover .tk-cta{color:#FBF7F0}
.tk.past{border-style:dashed;border-color:var(--ink-2);background:transparent;color:var(--ink-2)}.tk.past .tk-sub{color:var(--ink-2)}
.tk.past .tk-time{text-decoration:line-through}
.tk-kind{position:absolute;top:-8px;left:9px;font:700 10px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;background:var(--paper);color:var(--wine);padding:2px 5px}
.tks{display:flex;gap:10px;flex-wrap:wrap;padding-top:6px}

/* poster */
.ph{display:block;aspect-ratio:2/3;background:var(--a,#3F1921);position:relative;overflow:hidden;container-type:inline-size;max-width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph-t{position:absolute;inset:0;display:grid;align-content:end;gap:4cqw;padding:9cqw;color:var(--b,#E5E6DB)}
.ph-t b{font:600 max(10px,10.5cqw)/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em}
.ph-t i{font:italic 400 max(10px,9cqw)/1.1 var(--italic)}
@keyframes fadein{from{opacity:0}}

/* home: filters + gallery */
main{display:block;min-height:70vh}
.view{animation:rise .45s var(--ease)}
@keyframes rise{from{transform:translateY(8px)}}
.top{display:flex;align-items:end;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;padding-block:20px 14px}
.top>div:first-child{display:grid;gap:6px}
.top h1{font-size:clamp(25px,4.2vw,50px)}
.top .lab{padding-bottom:5px}
.fb{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:40;background:var(--paper);border-block:1px solid var(--line)}
.fb-in{display:flex;align-items:center;gap:0 30px;padding-block:5px;flex-wrap:wrap}
.fb-t{font-size:16px;letter-spacing:.06em}
.fsels{display:flex;gap:22px;min-width:0}
.pad,.hd .wrap{max-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:760px){.pad,.hd .wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
@media(min-width:1180px){.pad,.hd .wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.fb .sep{width:1px;height:22px;background:var(--line);flex:none}
.vt{display:flex;gap:18px;flex:none;margin-left:auto}

@media(max-width:760px){.fb-t{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.fb .chips{flex-basis:100%}.fsels{flex:1;gap:18px}.fb .fsel{min-width:0;flex:0 1 auto;font-size:13.5px}#f-kind{display:none}.vt{gap:14px}.meta p+p{display:none}}
.meta{display:flex;justify-content:space-between;gap:4px 20px;flex-wrap:wrap;padding-top:12px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-left:1px solid var(--line);margin-top:14px;border-top:1px solid var(--line)}
@media(min-width:620px){.gal{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.gal{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1180px){.gal{grid-template-columns:repeat(5,minmax(0,1fr))}}
.cell{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 12px 14px;display:grid;gap:9px;align-content:start;min-width:0;animation:rise .5s var(--ease) backwards}
@media(min-width:760px){.cell{padding:18px 18px 20px}}
.cell .ph{transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.cell:hover .ph{transform:translateY(-4px);box-shadow:0 18px 24px -18px rgba(35,20,23,.75)}
.cell h3{font-size:clamp(13.5px,1.25vw,16px);line-height:1.2;overflow-wrap:anywhere}
.cell h3 button{all:unset;cursor:pointer}
.cell h3 button::after{content:"";position:absolute;inset:0}
.cell h3 button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cell .by{font:italic 400 16px/1.15 var(--italic);color:var(--ink-2);margin-top:-5px}
.cell .nx{font-size:13.5px;line-height:1.35;border-top:1px solid var(--line);padding-top:8px}
.cell .nx b{font-weight:700;font-variant-numeric:tabular-nums}
.cell .nx span{white-space:nowrap}
.cell .mo{font-size:12.5px;color:var(--ink-2)}
.bm{position:absolute;z-index:2;top:18px;right:18px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(229,230,219,.92);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
@media(min-width:760px){.bm{top:24px;right:24px}}
.bm:hover{transform:scale(1.1)}
.bm svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:1.6}
.bm[aria-pressed=true]{background:var(--accent)}
.bm[aria-pressed=true] svg{fill:#FBF7F0;stroke:#FBF7F0}
.bm.popped{animation:bmpop .45s var(--ease)}
@keyframes bmpop{40%{transform:scale(1.35) rotate(-10deg)}}
.bm.inline{position:static;flex:none;border:1px solid var(--ink);background:transparent}
.bm.inline[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.after{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-block:26px 10px}
.empty{padding:44px 0;display:grid;gap:14px;justify-items:start}
.empty h3{font-size:22px}
.row{display:grid;grid-template-columns:54px minmax(170px,260px) 1fr;gap:18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row .ph{width:54px}
.row h3{font-size:15.5px;line-height:1.2}
.row h3 a{text-decoration:none}
.row h3 a:hover{text-decoration:underline}
.row .by{font:italic 400 16px/1.2 var(--italic);color:var(--ink-2);margin:2px 0 6px}
.row .tks{flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;min-width:0}
.row .allp{align-self:center;flex:none;font-size:13px;white-space:nowrap;padding-right:6px}
@media(max-width:820px){.row{grid-template-columns:46px 1fr}.row .ph{width:46px}.row .tks{grid-column:1/-1}}


/* mosaic */
.mos{--cols:2;--cg:10px;--rg:14px;--pad:16px;--u:calc((100vw - 2*var(--pad) - (var(--cols) - 1)*var(--cg))/var(--cols)*.7);display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:minmax(var(--u),auto);grid-auto-flow:dense;gap:var(--rg) var(--cg);padding:12px var(--pad) 0}
@media(min-width:760px){.mos{--cols:4;--cg:18px;--rg:24px;--pad:32px}}
@media(min-width:1180px){.mos{--cols:6;--cg:20px;--rg:28px;--pad:40px}}
.t{position:relative;overflow:hidden;background:var(--a,#3F1921);grid-column:span var(--c);grid-row:span var(--r);color:#F8F5EE;min-width:0}
.t:nth-child(3n+2){margin-top:10px}.t:nth-child(4n+3){margin-bottom:12px}.t:nth-child(5n+4){margin-right:10px}.t:nth-child(7n+1){margin-left:6px}
.t:not(.on){cursor:pointer}
.timg{position:absolute;inset:0;display:block}
.timg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.4s var(--ease)}
.t:not(.on):hover .timg img{transform:scale(1.045)}
.t .sc{position:absolute;inset:auto 0 0 0;padding:64px 14px 13px;display:grid;gap:3px;background:linear-gradient(transparent,rgba(18,9,11,.55) 40%,rgba(18,9,11,.92));text-shadow:0 1px 2px rgba(0,0,0,.5)}
.t .sc h3{font-size:clamp(13px,1.05vw,16px);line-height:1.15;overflow-wrap:anywhere}
.t.c2 .sc{padding:90px 18px 16px}
.t.c2 .sc h3{font-size:clamp(17px,1.9vw,27px)}
.t .sc h3 button{all:unset;cursor:pointer}
.t .sc h3 button::after{content:"";position:absolute;inset:0}
.t .sc h3 button:focus-visible{outline:none}.t:has(.sc h3 button:focus-visible){outline:3px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 3px #F6F6EF}
.t .sc .by{font:italic 400 16.5px/1.15 var(--italic);opacity:.95}
.t .sc .nx{font-size:13px;line-height:1.35;margin-top:3px}
.t .sc .nx b{font-weight:700;font-variant-numeric:tabular-nums}
.t .sc .mo{font-size:12px;opacity:.85}
.t .bm{top:10px;right:10px}
.t.on{grid-column:1/-1;grid-row:span 1;margin:0;background:var(--paper-2);color:var(--ink);overflow:visible;display:grid;scroll-margin-top:200px}
.t.on .timg{position:relative;inset:auto;height:min(52vh,120vw);background:var(--a)}
.t.on .timg img{object-fit:contain}
.oi{position:relative;padding:18px 16px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.oi h2{font-size:clamp(22px,2.6vw,36px);padding-right:44px}
.oi .by{font:italic 400 21px/1.2 var(--italic);color:var(--ink-2);margin-top:-4px}
.oi .syn{color:var(--ink-2);max-width:56ch}
.oi .x{position:absolute;top:14px;right:14px}
.oi .tks{padding-top:0}
@media(min-width:760px){.t.on{grid-row:span var(--or);grid-template-columns:auto minmax(0,1fr);height:calc(var(--or)*var(--u) + (var(--or) - 1)*var(--rg))}
 .t.on .timg{height:100%;aspect-ratio:2/3;max-width:46vw}.t.on .timg img{object-fit:cover}
 .oi{padding:28px clamp(22px,2.6vw,40px);align-content:center;overflow:auto}}
@media(min-width:1180px){.t.on{grid-column:2/span 4}}
.meta{padding-top:12px}

/* pages */
.ptitle{padding-block:30px 22px;display:grid;gap:8px}
.ptitle h1{font-size:clamp(30px,5.4vw,64px)}

 <section class="sec" style="border:0"><div class="carnet"><div><p class="lab">${tr('Pour celles et ceux qui reviennent','For those who come back')}</p><h2>${tr('Le carnet, <em>toutes les salles</em>','The carnet, <em>every venue</em>')}</h2><p>${tr("Cinq ou dix places valables un an dans les quatre cinémas partenaires. Choisissez « Place carnet » au moment de réserver.","Five or ten tickets valid for one year in all four partner cinemas. Pick “Carnet ticket” when you book.")}</p></div>
  <ul class="num"><li><span>${tr('Carnet 5 places','5-ticket carnet')}</span><span>${fmtP(32.5)}</span></li><li><span>${tr('Carnet 10 places','10-ticket carnet')}</span><span>${fmtP(60)}</span></li><li><span>${tr('Validité','Validity')}</span><span>${tr('12 mois','12 months')}</span></li><li><span>${tr('Frais','Fees')}</span><span>0 €</span></li></ul></div></section></div>`}
function dayStrip(act,cur){return `<div class="days" role="group" aria-label="${tr('Choisir un jour','Choose a day')}">${[0,1,2,3,4,5,6].map(d=>`<button data-act="${act}" data-v="${d}" aria-pressed="${cur===d}"><span class="lab">${dayShort(d)}</span><b>${dayDate(d).getDate()}</b></button>`).join('')}</div>`}
function filmSessions(w){const k=W.indexOf(w);let ss=ALL.filter(s=>s.w===k&&s.d===S.fday&&verOk(s,S.fver)&&(S.fmom==='all'||(S.fmom==='am'&&s.t<720)||(S.fmom==='pm'&&s.t>=720&&s.t<1080)||(S.fmom==='eve'&&s.t>=1080))&&(!S.facc||V[s.v].acc));
 const by=new Map();ss.forEach(s=>{if(!by.has(s.v))by.set(s.v,[]);by.get(s.v).push(s)});
 return `${dayStrip('fday',S.fday)}<div class="filters"><div class="chips">${[['all',tr('Toutes versions','All versions')],['vo','VO'],['vf','VF'],['en','English-friendly']].map(([a,l])=>`<button data-act="fver" data-v="${a}" aria-pressed="${S.fver===a}">${l}</button>`).join('')}</div>
  <div class="chips">${[['all',tr('Toute la journée','All day')],['am',tr('Matin','Morning')],['pm',tr('Après-midi','Afternoon')],['eve',tr('Soirée','Evening')]].map(([a,l])=>`<button data-act="fmom" data-v="${a}" aria-pressed="${S.fmom===a}">${l}</button>`).join('')}</div>
  <label class="check"><input type="checkbox" id="f-acc" data-act="facc" ${S.facc?'checked':''}>${tr('Accès fauteuil roulant','Wheelchair access')}</label></div>
  <p class="lab num" id="fcount">${fmtDay(S.fday)} · ${ss.length} ${tr('séances','showtimes')} · ${by.size} ${tr('salles','venues')}</p>
  ${by.size?[...by].map(([i,list])=>{const v=V[i];return `<div class="vg"><div><h3><a href="#salle-${v.id}">${esc(v.name)}</a></h3><p>${v.arr} · ${esc(v.q)} · ${esc(v.metro)}</p><p>${v.free?tr('Placement libre','Free seating'):tr('Placement numéroté','Numbered seats')}${v.acc?' · '+tr('accès fauteuil','wheelchair access'):''}</p><p class="pr">${tr('Plein','Full')} ${fmtP(v.p.full)} · ${tr('Réduit','Reduced')} ${fmtP(v.p.red)}${v.p.carnet?' · Carnet '+fmtP(v.p.carnet):''}</p></div>
   <div><div class="tks">${list.map(s=>chip(s)).join('')}</div><div class="tags" style="margin-top:12px">${[...new Set(list.map(s=>s.ver))].map(x=>verTag(x,w)).join('')}</div></div></div>`}).join(''):`<div class="empty"><h3>${tr('Aucune séance ce jour-là avec ces filtres','No showtimes that day with these filters')}</h3><button class="btn sm ghost" data-act="freset">${tr('Effacer les filtres','Clear filters')}</button></div>`}`}
function film(w){return `<div class="view wrap"><p class="crumb lab"><a href="#home">${tr('À l’affiche','Now showing')}</a> / ${w.type==='cinema'?tr('Cinéma','Cinema'):tr('Théâtre','Theatre')}</p>
 <div class="detail">${poster(w)}<div><p class="lab">${L(w.from)} · ${w.y}</p><h1>${esc(w.t)}</h1><p style="font-size:17px">${w.role?L(w.role):tr('Un film de','A film by')} <b>${esc(w.by)}</b> · ${tr('avec','with')} ${esc(w.cast)}</p>
  ${w.aw?`<p class="award" style="margin-top:12px">${L(w.aw)}</p>`:''}

 <section class="sec" id="sessions"><div class="sec-h"><p class="lab">${tr('Comparer les salles, les horaires et les prix','Compare venues, times and prices')}</p><h2>${w.type==='cinema'?tr('Séances','Showtimes'):tr('Représentations','Performances')}</h2></div><div id="fsess">${filmSessions(w)}</div></section></div>`}
function venueProg(v){const k=V.indexOf(v),ss=ALL.filter(s=>s.v===k&&s.d===S.vday);return `${dayStrip('vday',S.vday)}${ss.length?rows(ss):`<div class="empty"><h3>${tr('Relâche ce jour-là','Closed that day')}</h3></div>`}`}
function venue(v){const T2=[[tr('Plein tarif','Full price'),'',v.p.full],[tr('Tarif réduit','Reduced'),tr('Étudiant·e, −26 ans, demandeur·se d’emploi, 65 ans et +, sur justificatif','Students, under 26, jobseekers, 65 and over, with proof'),v.p.red],[tr('Enfant (−14 ans)','Child (under 14)'),'',v.p.child]];if(v.p.carnet)T2.push([tr('Place carnet','Carnet ticket'),tr('Carnet de 5 ou 10 places, valable un an','Book of 5 or 10 tickets, valid one year'),v.p.carnet]);
 return `<div class="view wrap"><p class="crumb lab"><a href="#salles">${tr('Salles','Venues')}</a> / ${v.arr}</p>
 <div class="detail"><span class="fac">${facade(v)}</span><div><p class="lab">${v.type==='cinema'?tr('Cinéma','Cinema'):tr('Théâtre','Theatre')} · ${v.arr} · ${esc(v.q)}</p><h1>${esc(v.name)}</h1><div class="tags">${v.labels.map(l=>`<span class="tag">${l}</span>`).join('')}<span class="tag">Pass Culture</span></div><p class="lead">${L(v.desc)}</p><div class="acts">${fbtn(v.id,tr('cette salle','this venue'))}</div></div></div>

 <section class="sec"><div class="sec-h"><p class="lab">${tr('Sept jours','Seven days')}</p><h2>Programme</h2></div><div id="vprog">${venueProg(v)}</div></section></div>`}
function cycle(c){return `<div class="view wrap"><p class="crumb lab"><a href="#agenda">${tr('Agenda','What’s on')}</a> / ${tr('Cycles','Seasons')}</p><div class="ptitle"><h1>${L(c.t)}</h1><p>${L(c.d)}</p><div>${fbtn(c.id,tr('ce cycle','this season'))}</div></div>
 <section class="sec"><h2 class="lab">${tr('Prochaines séances, toutes salles','Upcoming showtimes, all venues')}</h2>${rows(ALL.filter(s=>c.w.includes(W[s.w].id)&&up(s)),{venue:true,day:true,max:5})}</section></div>`}

/* ---------- booking ---------- */
const TAR=v=>{const a=[['full',tr('Plein tarif','Full price'),''],['red',tr('Tarif réduit','Reduced'),tr('Étudiant·e, −26 ans, demandeur·se d’emploi, 65 ans et +, sur justificatif','Students, under 26, jobseekers, 65 and over, with proof')],['child',tr('Enfant (−14 ans)','Child (under 14)'),'']];if(v.p.carnet)a.push(['carnet',tr('Place carnet','Carnet ticket'),tr('Carnet de 5 ou 10 places, valable un an','Book of 5 or 10 tickets, valid one year')]);return a};
const bkN=()=>Object.values(S.bk.qty).reduce((a,b)=>a+b,0);
const bkTot=v=>Object.entries(S.bk.qty).reduce((a,[k,n])=>a+n*(v.p[k]||0),0);
const taken=(s,i)=>((s.t*7+s.d*13+i*31+s.w*5)%7)<2;

 if(!s)return `<div class="view wrap empty" style="padding-block:80px"><h3>${tr("Cette séance n'existe plus",'This screening no longer exists')}</h3><a class="btn" href="#home">${tr("Retour à l'affiche",'Back to now showing')}</a></div>`;

 const names=[tr('Tarif','Fare'),tr('Places','Seats'),tr('Récapitulatif','Summary'),tr('Paiement','Payment'),tr('E-billet','E-ticket')],n=bkN(),tot=bkTot(v);
 const steps=`<ol class="steps">${names.map((x,i)=>`<li class="${i+1<b.step?'done':i+1===b.step?'on':''}"><button data-act="step" data-v="${i+1}" ${i+1<b.step&&b.step<5?'':'disabled'} ${i+1===b.step?'aria-current="step"':''}>${x}</button></li>`).join('')}</ol>`;
 const lines=TAR(v).filter(([k])=>b.qty[k]).map(([k,l])=>`<div><span>${b.qty[k]} × ${l}</span><span class="num">${fmtP(b.qty[k]*v.p[k])}</span></div>`).join('');
 const side=`<aside class="side" aria-label="${tr('Votre séance','Your screening')}"><div class="st">${poster(w)}<div><h2>${esc(w.t)}</h2><p>${esc(v.name)} · ${esc(s.room)}</p></div></div><p><b>${fmtDay(s.d)}</b><br>${fmtT(s.t)} → ≈ ${fmtT(endT(s))}${v.type==='cinema'&&!s.kind?` · ${tr('film à','film at')} ${fmtT(s.t+15)}`:''}</p><div class="tags">${verTag(s.ver,w)}${s.kind?`<span class="tag kind">${L(KIND[s.kind])}</span>`:''}</div><p style="font-size:13.5px;color:var(--ink-2)">${esc(v.addr)} · ${esc(v.metro)}</p><div class="lines">${lines}</div>${b.seats.length?`<p class="lab" style="color:var(--ink)">${tr('Places','Seats')} ${b.seats.join(', ')}</p>`:''}<div class="tot"><span>Total ${tr('TTC','incl. tax')}</span><output>${fmtP(tot)}</output></div><p class="pol">${tr("Aucun frais ne s'ajoute. Échange gratuit jusqu'à 2h avant la séance. Remboursement intégral si la séance est annulée.","Nothing is added. Free exchange up to 2 hours before. Full refund if the screening is cancelled.")}</p></aside>`;
 let body='';
 if(b.step===1)body=`<h1>${tr('Vos <em>tarifs</em>','Your <em>fares</em>')}</h1><p class="sub">${tr("Prix TTC. Aucun frais ne s'ajoutera au paiement.",'All-in prices. Nothing will be added at payment.')}</p>${TAR(v).map(([k,l,d])=>`<div class="qrow"><div><b>${l}</b> <span class="pp">· ${fmtP(v.p[k])}</span>${d?`<small>${d}</small>`:''}</div><div class="stepper"><button data-act="qty" data-k="${k}" data-v="-1" aria-label="${tr('Retirer','Remove')} ${l}" ${b.qty[k]?'':'disabled'}>−</button><output aria-live="polite">${b.qty[k]}</output><button data-act="qty" data-k="${k}" data-v="1" aria-label="${tr('Ajouter','Add')} ${l}" ${n>=6?'disabled':''}>+</button></div></div>`).join('')}<p class="note">${tr('Pass Culture : accepté comme moyen de paiement à l’étape 4 (15–18 ans).','Pass Culture: accepted as a payment method at step 4 (ages 15–18).')}</p><div class="bnav"><button class="btn go" data-act="next" ${n?'':'disabled'}>${tr('Continuer','Continue')}</button><a href="#film-${w.id}">${tr('Changer de séance','Change showtime')}</a></div>`;
 if(b.step===2){if(v.free)body=`<h1>${tr('Placement <em>libre</em>','Free <em>seating</em>')}</h1><p class="sub">${tr("Dans cette salle, on choisit son fauteuil en entrant.",'In this venue you choose your seat when you walk in.')}</p><p class="note">${tr(`Vos ${n>1?n+' places sont garanties':'place est garantie'}. Les portes ouvrent 20 minutes avant : arrivez à ${fmtT(s.t-20)} pour choisir tranquillement.`,`Your ${n>1?n+' seats are':'seat is'} guaranteed. Doors open 20 minutes before: arrive at ${fmtT(s.t-20)} to choose at your own pace.`)}</p>${v.acc?`<p class="note">${tr('Emplacements fauteuil roulant au dernier rang, accès de plain-pied.','Wheelchair spaces in the back row, step-free access.')}</p>`:''}`;
  else{let m='';'ABCDEFGH'.split('').forEach((r,ri)=>{m+=`<div class="r"><span class="lab">${r}</span>`;for(let c=1;c<=10;c++){const id=r+c,tk=taken(s,ri*10+c),on=b.seats.includes(id);m+=`<button class="seat" data-act="seat" data-v="${id}" aria-pressed="${on}" ${tk?'disabled':''} aria-label="${tr('Place','Seat')} ${id}${tk?tr(' occupée',' taken'):''}">${c}</button>`}m+='</div>'});
   body=`<h1>${tr('Vos <em>places</em>','Your <em>seats</em>')}</h1><p class="sub" aria-live="polite">${b.seats.length} / ${n} ${tr('sélectionnée(s)','selected')}</p><div class="scr lab">${tr('Scène','Stage')}</div><div class="map">${m}</div><p class="legend"><span class="seat" style="width:20px;display:inline-block"></span>${tr('Libre','Free')}<span class="seat" aria-pressed="true" style="width:20px;display:inline-block"></span>${tr('Votre choix','Your choice')}<span class="seat" style="width:20px;display:inline-block;background:var(--paper-3);border-color:transparent"></span>${tr('Occupée','Taken')}</p>`}
  body+=`<div class="bnav"><button class="btn go" data-act="next" ${v.free||b.seats.length===n?'':'disabled'}>${tr('Continuer','Continue')}</button><button class="btn ghost sm" data-act="step" data-v="1">${tr('Retour','Back')}</button></div>`}
 if(b.step===3)body=`<h1>${tr('Vérifiez avant de <em>payer</em>','Check before you <em>pay</em>')}</h1><p class="sub">${tr('Tout ce que vous paierez est sur cette page.','Everything you will pay is on this page.')}</p><dl class="facts" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><div><dt class="lab">${w.type==='cinema'?'Film':tr('Pièce','Play')}</dt><dd>${esc(w.t)} · ${dur(w.dur)}</dd></div><div><dt class="lab">${tr('Quand','When')}</dt><dd>${fmtDay(s.d)}, ${fmtT(s.t)} → ≈ ${fmtT(endT(s))}</dd></div><div><dt class="lab">${tr('Où','Where')}</dt><dd>${esc(v.name)}, ${esc(s.room)}<br>${esc(v.addr)}</dd></div><div><dt class="lab">Version</dt><dd>${L(VERT[s.ver])}</dd></div><div><dt class="lab">${tr('Places','Seats')}</dt><dd>${n} · ${v.free?tr('placement libre','free seating'):b.seats.join(', ')}</dd></div><div><dt class="lab">Total ${tr('TTC','incl. tax')}</dt><dd>${fmtP(tot)} · ${tr('0 € de frais','€0 fees')}</dd></div></dl><p class="note">${tr("Échange gratuit jusqu'à 2h avant la séance depuis votre e-billet. Remboursement intégral et automatique si la salle annule.","Free exchange up to 2 hours before, from your e-ticket. Full, automatic refund if the venue cancels.")}</p><div class="bnav"><button class="btn go" data-act="next">${tr('Passer au paiement','Go to payment')}</button><button class="btn ghost sm" data-act="step" data-v="2">${tr('Retour','Back')}</button></div>`;
 if(b.step===4)body=`<h1>${tr('Paiement','Payment')}</h1><p class="sub">${tr('Montant débité :','Amount charged:')} <b>${fmtP(tot)}</b>. ${tr('Rien de plus.','Nothing more.')}</p><div class="pay" role="radiogroup" aria-label="${tr('Moyen de paiement','Payment method')}">
   <label><input type="radio" name="pay" id="pay-card" value="card" ${b.pay==='card'?'checked':''}><span><b>${tr('Carte bancaire','Bank card')}</b><small>${tr("Formulaire sécurisé Stripe. Votre numéro de carte ne transite jamais par Strapontin et n'est pas conservé.","Secure Stripe form. Your card number never passes through Strapontin and is not stored.")}</small></span></label>
   <label><input type="radio" name="pay" id="pay-pass" value="pass" ${b.pay==='pass'?'checked':''}><span><b>Pass Culture</b><small>${tr('15–18 ans. Vous validez la réservation dans votre application Pass Culture.','Ages 15–18. You confirm the booking in your Pass Culture app.')}</small></span></label>
   ${v.p.carnet&&b.qty.carnet?`<label><input type="radio" name="pay" id="pay-carnet" value="carnet" ${b.pay==='carnet'?'checked':''}><span><b>${tr('Carnet Strapontin','Strapontin carnet')}</b><small>${tr('Vos places carnet sont décomptées de votre carnet en cours.','Your carnet tickets are deducted from your current book.')}</small></span></label>`:''}</div>
   <p class="note"><b>${tr('Maquette','Mockup')}</b> · ${tr("Aucun paiement réel. Ici s'affichera le formulaire hébergé par Stripe.",'No real payment. The Stripe-hosted form would appear here.')}</p>

 if(b.step===5){let qr='';for(let i=0;i<169;i++){const r=Math.floor(i/13),c=i%13,cor=(r<3&&c<3)||(r<3&&c>9)||(r>9&&c<3);qr+=`<i class="${cor||((i*i*7+s.t+i*s.w)%3===0)?'':'o'}"></i>`}
  body=`<h1>${tr('C’est <em>réservé</em>','You’re <em>booked</em>')}</h1><p class="sub">${tr('Présentez ce billet à l’entrée, sur votre téléphone ou imprimé.','Show this ticket at the door, on your phone or printed.')}</p>
  <div class="eticket"><div class="a"><p class="lab">${esc(v.name)} · ${esc(s.room)}</p><h2>${esc(w.t)}</h2><p><b>${fmtDay(s.d)}</b> · ${fmtT(s.t)} → ≈ ${fmtT(endT(s))}</p><div class="tags">${verTag(s.ver,w)}${s.kind?`<span class="tag kind">${L(KIND[s.kind])}</span>`:''}</div><p style="font-size:14px">${esc(v.addr)}<br>${esc(v.metro)}</p></div>
  <div class="b"><div class="qr" role="img" aria-label="${tr('Code du billet (spécimen)','Ticket code (specimen)')}">${qr}</div><div><p class="lab">${tr('Réservation','Booking')} ${b.ref}</p><p><b>${n} ${n>1?tr('places','seats'):tr('place','seat')}</b> · ${v.free?tr('placement libre','free seating'):b.seats.join(', ')}</p><p class="num">${fmtP(tot)} ${tr('TTC','incl. tax')}</p><p class="lab">${tr('Spécimen','Specimen')}</p></div></div></div>

 return `<div class="view wrap">${steps}<div class="book"><div>${body}</div>${b.step<5?side:''}</div></div>`}

 return `<div class="scrim" data-act="sheet-close"></div><div class="panel sheet" role="dialog" aria-modal="true" aria-label="${esc(w.t)}"><button class="x" data-act="sheet-close" aria-label="${tr('Fermer','Close')}" id="sx">×</button>
 <div class="sh-top">${poster(w)}<div><p class="lab">${L(w.from)} · ${w.y} · ${dur(w.dur)}</p><h2>${esc(w.t)}</h2><p class="by">${w.role?L(w.role)+' ':''}${esc(w.by)}</p>${w.aw?`<p class="award">${L(w.aw)}</p>`:''}</div></div>

 <div><p class="lab">${filt?tr('Séances','Showtimes')+' · '+WHEN().find(x=>x[0]===S.when)[2]:tr('Prochaines séances','Next showtimes')}</p><div class="tks" style="margin-top:8px">${ss.slice(0,6).map(s=>chip(s,{venue:true,day:true})).join('')}</div></div>
 <div class="acts"><a class="btn sm" href="#film-${w.id}" data-act="sheet-close">${tr('Fiche et toutes les séances','Details and all showtimes')}</a><button class="fbtn" data-act="save" data-id="${w.id}" aria-pressed="${S.list.includes(w.id)}">${S.list.includes(w.id)?'✓ '+tr('Dans ma liste','In my list'):'+ '+tr('Ajouter à ma liste','Add to my list')}</button></div></div>`}
function layer(){const saved=S.list.map(id=>W[wi(id)]).filter(Boolean),fv=S.follow.map(id=>V[vi(id)]).filter(Boolean),fc=S.follow.map(id=>CYC.find(c=>c.id===id)).filter(Boolean);
 let h='';
 if(S.sheet)h+=sheetHTML();
 if(S.drawer)h+=`<div class="scrim" data-act="drawer-close"></div><div class="panel drawer" role="dialog" aria-modal="true" aria-label="${tr('Ma liste','My list')}"><header><h2>${tr('Ma <em>liste</em>','My <em>list</em>')}</h2><button class="x" data-act="drawer-close" aria-label="${tr('Fermer','Close')}" id="dx">×</button></header>
  <div><p class="lab" style="margin-bottom:8px">${tr('À voir','To see')} (${saved.length})</p>${saved.length?saved.map(w=>{const nx=ALL.find(s=>W[s.w]===w&&up(s));return `<div class="it">${poster(w)}<div><a href="#film-${w.id}" data-act="drawer-close">${esc(w.t)}</a><small>${nx?`${dayShort(nx.d)} ${fmtT(nx.t)} · ${esc(V[nx.v].name)}`:tr('Pas de séance cette semaine','No screenings this week')}</small></div><button class="x" data-act="save" data-id="${w.id}" aria-label="${esc(tr('Retirer ','Remove ')+w.t+tr(' de ma liste',' from my list'))}">×</button></div>`}).join(''):`<p style="color:var(--ink-2)">${tr('Touchez le signet sur une affiche pour garder un film de côté.','Tap the bookmark on a poster to keep a film for later.')}</p>`}</div>
  <div><p class="lab" style="margin-bottom:8px">${tr('Salles et cycles suivis','Followed venues and seasons')} (${fv.length+fc.length})</p>${fv.map(v=>`<div class="it" style="grid-template-columns:1fr auto"><div><a href="#salle-${v.id}" data-act="drawer-close">${esc(v.name)}</a><small>${v.arr} · ${esc(v.q)}</small></div><button class="x" data-act="follow" data-id="${v.id}" aria-label="${esc(tr('Ne plus suivre ','Unfollow ')+v.name)}">×</button></div>`).join('')}${fc.map(c=>`<div class="it" style="grid-template-columns:1fr auto"><div><a href="#cycle-${c.id}" data-act="drawer-close">${L(c.t)}</a><small>Cycle</small></div><button class="x" data-act="follow" data-id="${c.id}" aria-label="${esc(tr('Ne plus suivre ','Unfollow ')+L(c.t))}">×</button></div>`).join('')}${fv.length+fc.length?'':`<p style="color:var(--ink-2)">${tr('Suivez une salle ou un cycle pour être prévenu·e des nouvelles séances.','Follow a venue or a season to hear about new screenings.')}</p>`}</div>
  <p class="note">${tr('Votre liste est enregistrée sur cet appareil.','Your list is saved on this device.')}</p></div>`;
 if(S.cookie===null)h+=`<div class="optin" role="region" aria-label="${tr('Cookies et mesure d’audience','Cookies and audience measurement')}"><div class="wrap"><p>${tr("Cookies nécessaires au fonctionnement du site et, avec votre accord, mesure d'audience.","Cookies needed for the site to work and, with your consent, audience measurement.")}</p><div class="two"><button class="btn ghost sm" data-act="cookie" data-v="no">${tr('Refuser','Decline')}</button><button class="btn ghost sm" data-act="cookie" data-v="yes">${tr('Accepter','Accept')}</button></div></div></div>`;
 $('#layer').innerHTML=h+(S.toast?`<div class="toast" aria-hidden="true">${S.toast}</div>`:'');
 document.body.style.overflow=S.sheet||S.drawer?'hidden':'';['#chrome','#main','#foot','#dockbox'].forEach(q=>{const n=$(q);if(n)n.inert=!!(S.sheet||S.drawer)});
 document.querySelectorAll('#listn,.listn').forEach(n=>n.textContent=S.list.length+S.follow.length)}
let st;function say(m){const e=$('#status');if(!e)return;e.textContent='';clearTimeout(st);st=setTimeout(()=>{e.textContent=m},80)}
let opener=null;function restoreFocus(){const o=opener;opener=null;const t=o&&document.contains(o)?o:document.querySelector('.tbtn');if(t&&!location.hash.match(/^#(film|salle|cycle)-/))t.focus({preventScroll:true})}
let tt;function toast(m){say(m);S.toast=m;layer();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';const e=$('.toast');if(e)e.remove()},2600)}

/* ---------- posters (mockup only): looked up on Wikipedia at view time, never stored in the project ---------- */
async function loadPosters(){await Promise.all(W.filter(w=>w.wk&&!S.img[w.id]).map(async w=>{
 try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(w.wk));if(!r.ok)return;const j=await r.json(),o=j.originalimage,t=j.thumbnail;
  /* originals can be several MB: ask for a 640px thumbnail when the original is larger */
  let u=o&&o.width<=800?o.source:t&&t.source?t.source.replace(/\/\d+px-/,'/640px-'):o&&o.source;if(!u)return;
  S.img[w.id]=u;store.set('img2',S.img);document.querySelectorAll(`[data-p="${w.id}"]`).forEach(e=>{e.outerHTML=poster(w)});document.querySelectorAll(`[data-pt="${w.id}"]`).forEach(e=>{e.innerHTML=`<img src="${esc(u)}" alt="" decoding="async">`})}catch(e){}}))}

/* ---------- router ---------- */
function parse(){const h=location.hash.slice(1);let m;
 if((m=h.match(/^film-(.+)$/))&&wi(m[1])>-1)return{n:'film',id:m[1]};
 if((m=h.match(/^salle-(.+)$/))&&vi(m[1])>-1)return{n:'salle',id:m[1]};
 if((m=h.match(/^cycle-(.+)$/))&&CYC.some(c=>c.id===m[1]))return{n:'cycle',id:m[1]};
 if(m=h.match(/^reserver-(.+)$/))return{n:'book',id:m[1]};
 if(h==='agenda'||h==='salles')return{n:h};
 return{n:'home'}}
function view(){const r=S.route;return r.n==='film'?film(W[wi(r.id)]):r.n==='salle'?venue(V[vi(r.id)]):r.n==='cycle'?cycle(CYC.find(c=>c.id===r.id)):r.n==='book'?booking():r.n==='agenda'?agenda():r.n==='salles'?salles():home()}
function paint(keep){const y=scrollY;$('#main').innerHTML=view();if(keep){const v=$('.view');if(v)v.style.animation='none';scrollTo({top:y,behavior:'instant'})}}
let pending=null,booted=false;
function route(){const r=parse(),same=JSON.stringify(r)===JSON.stringify(S.route);S.route=r;S.sheet=null;S.drawer=false;S.open=null;if(!same){S.q='';acSel=-1}
 if(r.n==='book'&&(!S.bk||S.bk.sid!==r.id))S.bk={sid:r.id,step:1,qty:{full:1,red:0,child:0,carnet:0},seats:[],pay:'card',ref:''};
 if(r.n==='film'&&!same){S.fday=0;S.fver='all';S.fmom='all';S.facc=false;const k=wi(r.id),f=ALL.find(s=>s.w===k&&up(s));if(f)S.fday=f.d}
 if(r.n==='salle'&&!same)S.vday=0;
 const go=()=>{renderChrome();paint(false);layer();const a=pending;pending=null;if(a&&document.getElementById(a))document.getElementById(a).scrollIntoView({behavior:'instant',block:'start'});else scrollTo({top:0,behavior:'instant'})};
 if(same&&pending){const el=document.getElementById(pending);pending=null;if(el)el.scrollIntoView({behavior:'smooth'});return}
 go();
 document.title=r.n==='home'?'Strapontin':(r.n==='film'?W[wi(r.id)].t:r.n==='salle'?V[vi(r.id)].name:r.n==='cycle'?L(CYC.find(c=>c.id===r.id).t):r.n==='agenda'?tr('Agenda','What’s on'):r.n==='salles'?tr('Salles','Venues'):tr('Réserver','Book'))+' · Strapontin'}
function part(id,html){const e=document.getElementById(id);if(e)e.innerHTML=html}

/* ---------- search ---------- */
let IDX=null;function searchIndex(){if(IDX&&IDX.lang===S.lang)return IDX.list;IDX={lang:S.lang,list:buildIndex()};return IDX.list}
function buildIndex(){return[...W.map(w=>({g:w.type==='cinema'?tr('Films','Films'):tr('Pièces','Plays'),t:w.t,s:w.by,k:norm(w.t+' '+w.by+' '+w.cast+' '+(w.wk||'').replace(/_/g,' ')),h:'#film-'+w.id})),...CYC.map(c=>({g:tr('Cycles','Seasons'),t:L(c.t),s:c.w.length+' films',k:norm(c.t.fr+' '+c.t.en+' '+c.w.map(id=>W[wi(id)].by).join(' ')),h:'#cycle-'+c.id})),...V.map(v=>({g:tr('Salles','Venues'),t:v.name,s:v.arr+' · '+v.q,k:norm(v.name+' '+v.q+' '+v.arr+' '+v.rooms.join(' ')),h:'#salle-'+v.id}))]}
let acSel=-1;
function ac(){const q=norm(S.q.trim()),box=$('#acbox'),inp=$('#q');if(!box)return;if(!q){box.innerHTML='';inp.setAttribute('aria-expanded','false');return}
 acSel=Math.min(acSel,8);const res=searchIndex().filter(x=>x.k.includes(q)).slice(0,9),hl=t=>{const i=norm(t).indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))};
 let g='',h='',gi=0;res.forEach((x,i)=>{if(x.g!==g){if(g)h+='</div>';g=x.g;gi++;h+=`<div role="group" aria-labelledby="acg${gi}"><div class="acg" id="acg${gi}">${g}</div>`}h+=`<a href="${x.h}" role="option" id="ac${i}" aria-selected="${i===acSel}"><span>${hl(x.t)}</span><small>${hl(x.s)}</small></a>`});if(g)h+='</div>';
 clearTimeout(ac.t);ac.t=setTimeout(()=>say(res.length?res.length+' '+tr(res.length>1?'suggestions':'suggestion',res.length>1?'suggestions':'suggestion'):tr('Aucun résultat','No results')),600);
 box.innerHTML=`<div class="ac" id="ac" role="listbox" aria-label="${tr('Suggestions','Suggestions')}">${h||`<p class="none">${tr('Aucun résultat pour','No results for')} ${tr('« ','“')}${esc(S.q)}${tr(' »','”')}</p>`}</div>`;inp.setAttribute('aria-expanded','true')}
const closeAc=()=>{S.q='';acSel=-1;const i=$('#q');if(i){i.value='';i.removeAttribute('aria-activedescendant')}ac()};

/* ---------- events ---------- */
function flip(change){const a=new Map([...document.querySelectorAll('#hb .t')].map(e=>[e.dataset.id,e.getBoundingClientRect()]));change();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 document.querySelectorAll('#hb .t').forEach(e=>{const p=a.get(e.dataset.id),n=e.getBoundingClientRect();if(!p||!n.width||!e.animate)return;e.animate([{transformOrigin:'0 0',transform:`translate(${p.left-n.left}px,${p.top-n.top}px) scale(${p.width/n.width},${p.height/n.height})`},{transformOrigin:'0 0',transform:'none'}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)'})})}
function openTile(id){flip(()=>{S.open=id;part('hb',homeBody())});const on=$('.t.on');if(on){const off=($('#hd').offsetHeight||58)+14;let y=0,e=on;while(e){y+=e.offsetTop;e=e.offsetParent}const ty=Math.max(0,y-off);scrollTo({top:ty,behavior:'smooth'});setTimeout(()=>{if(S.open===id&&Math.abs(scrollY-ty)>6)scrollTo({top:ty,behavior:'instant'})},900);const x=$('#tx');if(x)x.focus({preventScroll:true})}}
/* Phones fire 'resize' when the URL bar hides on scroll and when the keyboard opens. Rebuilding the dock or the gallery then
   destroyed the search field being typed in and redrew every poster mid-scroll. Only a real width change re-lays anything out. */
const colsFor=w=>w>=1180?6:w>=760?4:2;let rz,lastW=innerWidth;
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const w=innerWidth;if(w===lastW)return;const was=lastW;lastW=w;
 if((was<=820)!==(w<=820))syncDock();
 if(S.route.n==='home'&&S.view==='gal'&&(colsFor(was)!==colsFor(w)||S.open))part('hb',homeBody())},180)});
/* Keyboard on iOS: keep the dock and its suggestions above it, inside the visible area. */
const vv=window.visualViewport;function vvSync(){const r=document.documentElement.style,gap=vv?Math.round(innerHeight-vv.height-vv.offsetTop):0,typing=document.activeElement&&document.activeElement.id==='q',kb=typing&&gap>100?gap:0;r.setProperty('--kb',kb+'px');r.setProperty('--vvh',Math.round(vv?vv.height:innerHeight)+'px')}
if(vv){vv.addEventListener('resize',vvSync);vv.addEventListener('scroll',vvSync)}document.addEventListener('focusout',()=>setTimeout(vvSync,50));vvSync();
const announceHome=()=>{const h=$('#hb .mt'),st=$('#hb .stats'),em=$('#hb .empty h3');say([h&&h.textContent,em?em.textContent:st&&st.textContent].filter(Boolean).join('. '))};
const refreshHome=()=>{S.open=null;part('hb',homeBody());syncDock();announceHome();const m=$('#hb .meta');if(m){const top=m.getBoundingClientRect().top+scrollY-(($('#hd')||{}).offsetHeight||58)-8;if(scrollY>top)scrollTo({top:Math.max(0,top),behavior:'instant'})}};
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;acSel=-1;ac()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Tab'&&(S.drawer||S.sheet)){const pn=$('#layer .panel');if(pn){const f=[...pn.querySelectorAll('a[href],button:not([disabled]),input,select,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);if(f.length){const first=f[0],last=f[f.length-1];if(!pn.contains(document.activeElement)){e.preventDefault();first.focus()}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}}
 if(e.key==='Escape'){if(S.drawer||S.sheet){S.drawer=false;S.sheet=null;layer();restoreFocus()}else if(S.open&&S.route.n==='home')openTile(null);closeAc();const d=$('#dock');if(d)d.classList.remove('srch')}
 if(e.target.id==='q'){const items=[...document.querySelectorAll('#ac a')];if(!items.length){if(e.key==='Enter')e.preventDefault();return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();acSel=(acSel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((a,i)=>a.setAttribute('aria-selected',i===acSel));e.target.setAttribute('aria-activedescendant','ac'+acSel)}
  if(e.key==='Enter'){e.preventDefault();location.hash=(items[acSel<0?0:acSel]).getAttribute('href');closeAc();e.target.blur()}}});
document.addEventListener('change',e=>{const a=e.target.dataset.act;
 if(a==='arr'||a==='ver'||a==='whens'){S[a==='whens'?'when':a]=e.target.value;refreshHome()}
 if(a==='facc'){S.facc=e.target.checked;part('fsess',filmSessions(W[wi(S.route.id)]));const fc=$('#fcount');if(fc)say(fc.textContent);const c=$('#f-acc');if(c)c.focus()}
 if(e.target.name==='pay'&&S.bk)S.bk.pay=e.target.value});
document.addEventListener('click',e=>{
 if(e.target.id==='skip'){e.preventDefault();$('#main').focus();$('#main').scrollIntoView();return}
 if(!e.target.closest('.dock')){if(S.q)closeAc();const d=$('#dock');if(d)d.classList.remove('srch')}
 const sc=e.target.closest('[data-scroll]');
 if(sc){e.preventDefault();const el=document.getElementById(sc.dataset.scroll);if(el)el.scrollIntoView({behavior:'smooth'});return}
 const acA=e.target.closest('#ac a');if(acA){setTimeout(closeAc,0);return}
 const tile=e.target.closest('article.t:not(.on)');if(tile&&!e.target.closest('.bm')){openTile(tile.dataset.id);return}
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v,b=S.bk;
 const refocus=sel=>{const x=$(sel);if(x)x.focus({preventScroll:true})};
 if(a==='lang'){S.lang=v;store.set('lang',v);renderChrome();paint(true);layer()}
 if(a==='view'&&S.route.n!=='home'){location.hash='home'}
 if(a==='so'){const d=$('#dock');d.classList.add('srch');refocus('#q')}
 if(a==='sx'){const d=$('#dock');d.classList.remove('srch');closeAc();const q=$('#q');if(q)q.blur()}
 if(a==='when'){S.when=v;refreshHome()}
 if(a==='view'){S.view=v;refreshHome();if(el.closest('.after'))scrollTo({top:0,behavior:'smooth'})}
 if(a==='reset'){S.arr='all';S.ver='all';S.when='week';refreshHome()}
 if(a==='topen'){openTile(el.dataset.id)}
 if(a==='tclose'){openTile(null)}
 if(a==='sheet'){opener=el;S.sheet=el.dataset.id;layer();refocus('#sx')}
 if(a==='lucky'){const pool=[...new Set(finderSet().map(s=>s.w))];if(pool.length)openTile(W[pool[Math.floor(Math.random()*pool.length)]].id)}
 if(a==='sheet-close'){S.sheet=null;layer();restoreFocus()}
 if(a==='fday'||a==='fver'||a==='fmom'){S[a]=a==='fday'?+v:v;part('fsess',filmSessions(W[wi(S.route.id)]));const fc=$('#fcount');if(fc)say(fc.textContent);refocus(`#fsess [data-act="${a}"][data-v="${v}"]`)}
 if(a==='freset'){S.fver='all';S.fmom='all';S.facc=false;part('fsess',filmSessions(W[wi(S.route.id)]))}
 if(a==='vday'){S.vday=+v;part('vprog',venueProg(V[vi(S.route.id)]));refocus(`#vprog [data-act="vday"][data-v="${v}"]`)}
 if(a==='save'||a==='follow'){e.preventDefault();const id=el.dataset.id,arr=a==='save'?S.list:S.follow,i=arr.indexOf(id);if(i>-1)arr.splice(i,1);else arr.push(id);store.set(a==='save'?'list3':'follow',arr);
  if(el.closest('.drawer')){layer()}else document.querySelectorAll(`[data-act="${a}"][data-id="${id}"]`).forEach(x=>{x.setAttribute('aria-pressed',i<0);if(x.classList.contains('bm')){x.classList.remove('popped');x.getBoundingClientRect();if(i<0)x.classList.add('popped')}else if(a==='save')x.textContent=i<0?'✓ '+tr('Dans ma liste','In my list'):'+ '+tr('Ajouter à ma liste','Add to my list');else x.textContent=i<0?'✓ '+tr('Suivi','Following'):'+ '+tr('Suivre','Follow')});
  document.querySelectorAll('#listn,.listn').forEach(n=>n.textContent=S.list.length+S.follow.length);
  toast(a==='save'?(i<0?tr('Ajouté à votre liste','Added to your list'):tr('Retiré de votre liste','Removed from your list')):(i<0?tr('Suivi','Following'):tr('Vous ne suivez plus','Unfollowed')))}
 if(a==='drawer'){opener=el.closest('.tbtn')||el;S.drawer=true;layer();refocus('#dx')}
 if(a==='drawer-close'){S.drawer=false;layer();restoreFocus()}
 if(a==='cookie'){S.cookie=v;store.set('cookie',v);if(v==='yes'){loadClarity();loadGA4()}else{if(window.clarity)clarity('consent',false);revokeGA4()}layer()}
 if(a==='cookie-open'){S.cookie=null;layer()}
 if(!b||S.route.n!=='book')return;
 if(a==='qty'){const k=el.dataset.k;b.qty[k]=Math.max(0,b.qty[k]+ +v);b.seats=[];paint(true);refocus(`[data-act="qty"][data-k="${k}"][data-v="${v}"]:not(:disabled)`)}
 if(a==='seat'){const i=b.seats.indexOf(v);if(i>-1)b.seats.splice(i,1);else{if(b.seats.length>=bkN())b.seats.shift();b.seats.push(v)}paint(true);refocus(`[data-act="seat"][data-v="${v}"]`)}
 if(a==='step'||a==='next'){b.step=a==='next'?b.step+1:+v;paint(false);scrollTo({top:0,behavior:'smooth'});$('#main').focus({preventScroll:true})}
 if(a==='pay'){el.disabled=true;el.textContent=tr('Paiement en cours…','Processing…');setTimeout(()=>{b.ref='STR-'+(b.sid.replace(/x/g,'')*7%1e6).toString(36).toUpperCase().padStart(4,'7');b.step=5;paint(false);scrollTo({top:0,behavior:'smooth'});toast(tr('Réservation confirmée','Booking confirmed'))},900)}
});
window.addEventListener('hashchange',route);
route();booted=true;loadPosters();
