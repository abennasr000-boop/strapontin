<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strapontin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a programme sheet. Cream paper, hairline grid, tickets you tear off, posters and polaroids pinned on top. Single committed light look (brand decision). */
:root{
  --paper:#EEE1D1; --paper-2:#F7EFE4; --paper-3:#E3D2BD;
  --ink:#3F1921; --ink-2:#6A4A4E; --line:rgba(63,25,33,.2);
  --orange:#D6411F; --orange-ink:#B5340F;
  --rasp:#7D222F; --green:#8E6D06; --green-ink:#6B5204; --blue:#90ADBF;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono","SFMono-Regular",Menlo,monospace;
  --r:10px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:700px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.mono{font:500 12.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper-2);padding:10px 16px;border-radius:8px;z-index:100}
.skip:focus{left:16px}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line);transition:box-shadow .3s}
.hd.scrolled{box-shadow:0 6px 24px -12px rgba(63,25,33,.35)}
.hd-row{display:flex;align-items:center;gap:14px;padding-block:12px}
.logo{display:flex;align-items:center;gap:8px;font:700 26px/1 var(--display);text-decoration:none;letter-spacing:-.02em;flex:none}
.logo svg{width:17px;height:24px;transition:transform .4s var(--ease);transform-origin:20% 90%}
.logo:hover svg{transform:rotate(-14deg)}
.city{flex:none;font:500 12.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--ink-2)}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;background:var(--paper-2);border:1.5px solid var(--ink);border-radius:99px;padding:10px 16px 10px 42px;outline-offset:3px}
.search input::placeholder{color:var(--ink-2)}
.search>svg{position:absolute;left:15px;top:50%;translate:0 -50%;width:18px;height:18px;pointer-events:none}
.ac{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--paper-2);border:1.5px solid var(--ink);border-radius:14px;box-shadow:5px 6px 0 var(--ink);padding:8px;max-height:min(70vh,460px);overflow:auto;animation:pop .18s var(--ease)}
.ac h4{margin:8px 10px 4px;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ac a{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:9px 10px;border-radius:8px;text-decoration:none}
.ac a small{color:var(--ink-2);font-size:13.5px;text-align:right}
.ac a[aria-selected=true],.ac a:hover{background:var(--paper-3)}
.ac mark{background:none;color:var(--orange-ink);font-weight:700}
.ac .none{padding:14px 10px;color:var(--ink-2)}
.hbtn{flex:none;display:inline-flex;align-items:center;gap:7px;background:none;border:1.5px solid var(--ink);border-radius:99px;padding:8px 13px;font-weight:600;font-size:14.5px;transition:background .2s,color .2s}
.hbtn:hover{background:var(--ink);color:var(--paper-2)}
.hbtn .n{font:500 12px var(--mono);background:var(--orange-ink);color:var(--paper-2);border-radius:99px;min-width:20px;padding:1px 6px;text-align:center}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:8px 10px;font:500 12.5px var(--mono)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper-2)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font-weight:500;font-size:15px;padding:5px 12px;border-radius:99px;transition:background .2s}
.nav a:hover{background:var(--paper-3)}
.assure{background:var(--ink);color:var(--paper)}
.assure ul{list-style:none;margin:0;padding-block:9px;display:flex;flex-wrap:wrap;gap:4px 28px;font-size:14px}
.assure li{display:flex;gap:8px;align-items:center}
.assure li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none}
@media(max-width:760px){.assure ul{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:22px}.assure li{flex:none}.city,.hbtn .lbl{display:none}.logo{font-size:22px}.hd-row{gap:8px;flex-wrap:wrap}.search{order:5;flex-basis:100%}}

/* buttons, tags */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--orange-ink);color:var(--paper-2);border:1.5px solid var(--ink);border-radius:99px;padding:12px 22px;font-weight:700;text-decoration:none;box-shadow:3px 4px 0 var(--ink);transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .2s}
.btn:hover{transform:translate(-1px,-2px);box-shadow:5px 7px 0 var(--ink);background:var(--orange)}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--paper-2);color:var(--ink)}
.btn.ghost:hover{background:var(--paper-3)}
.btn.sm{padding:8px 15px;font-size:14.5px;box-shadow:2px 3px 0 var(--ink)}
.tag{display:inline-flex;align-items:center;font:500 12.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:5px;border:1px solid var(--ink);white-space:nowrap}
.tag.vo{background:var(--blue)}
.tag.en{background:var(--ink);color:var(--paper-2)}
.tag.label{border-color:var(--green-ink);color:var(--green-ink)}
.tag.kind{background:var(--rasp);color:var(--paper-2);border-color:var(--rasp)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.laurel{display:inline-flex;gap:8px;align-items:center;font:500 13px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--green-ink)}
.laurel::before,.laurel::after{content:"";width:9px;height:18px;border:2px solid var(--green);border-right:0;border-radius:99px 0 0 99px}
.laurel::after{transform:scaleX(-1)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--paper-2);border:1.5px solid var(--ink);border-radius:99px;padding:8px 15px;font-weight:600;font-size:15px;transition:background .2s,color .2s,transform .15s}
.seg button:hover{transform:translateY(-1px)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper-2)}
.seg button small{display:block;font:400 12px var(--mono);opacity:.8}
select.sel{background:var(--paper-2);border:1.5px solid var(--ink);border-radius:99px;padding:9px 34px 9px 15px;font-weight:600;font-size:15px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.check{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--orange-ink)}

/* ticket chip */
.tk{display:inline-flex;align-items:stretch;background:var(--paper-2);border:1.5px solid var(--ink);border-radius:var(--r);text-decoration:none;transition:transform .2s var(--ease),box-shadow .2s var(--ease);flex:none;position:relative}
.tk-main{padding:7px 12px 8px;display:grid;align-content:center;min-width:92px}
.tk-time{font:500 19px/1.15 var(--mono);letter-spacing:-.02em}
.tk-sub{font-size:12.5px;line-height:1.3;color:var(--ink-2);white-space:nowrap}
.tk-stub{padding:7px 12px;border-left:1.5px dashed var(--ink);display:grid;align-content:center;justify-items:center;border-radius:0 8px 8px 0;transition:transform .25s var(--ease),background .2s,color .2s;transform-origin:0 100%}
.tk-price{font:500 13.5px var(--mono);white-space:nowrap}
.tk-cta{font-weight:700;font-size:13px;color:var(--orange-ink);white-space:nowrap}
a.tk:hover{transform:translateY(-3px);box-shadow:3px 5px 0 var(--ink)}
a.tk:hover .tk-stub{background:var(--orange-ink);color:var(--paper-2);transform:rotate(4deg) translateX(2px)}
a.tk:hover .tk-cta{color:var(--paper-2)}
.tk.past{opacity:.5;border-style:dashed}
.tk.past .tk-time{text-decoration:line-through}
.tk-kind{position:absolute;top:-9px;left:10px;font:500 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;background:var(--rasp);color:var(--paper-2);padding:3px 6px;border-radius:4px}
.tks{display:flex;gap:10px;flex-wrap:wrap;padding-top:6px}

/* poster */
.poster{aspect-ratio:2/3;max-width:100%;border-radius:6px;position:relative;overflow:hidden;container-type:inline-size;border:1.5px solid var(--ink);display:block;background-color:var(--a)}
.poster i{position:absolute;left:0;right:0;top:0;padding:5cqw 6cqw;font:500 max(9px,5.2cqw)/1.3 var(--mono);font-style:normal;letter-spacing:.05em;text-transform:uppercase;background:var(--a);color:var(--c)}
.poster b{position:absolute;left:-3cqw;bottom:-16cqw;font:800 78cqw/1 var(--display);letter-spacing:-.06em;color:var(--c);white-space:nowrap}
.p0{background-image:radial-gradient(circle at 50% 100%,var(--b) 0 68%,transparent 70%);background-size:18cqw 9cqw}
.p1{background-image:linear-gradient(135deg,var(--b) 25%,transparent 25%),linear-gradient(225deg,var(--b) 25%,transparent 25%),linear-gradient(315deg,var(--b) 25%,transparent 25%),linear-gradient(45deg,var(--b) 25%,transparent 25%);background-size:16cqw 16cqw;background-position:-8cqw 0,-8cqw 0,0 0,0 0}
.p2{background-image:conic-gradient(var(--b) 25%,transparent 0 50%,var(--b) 0 75%,transparent 0);background-size:16cqw 32cqw}
.p3{background-image:radial-gradient(circle,var(--b) 0 36%,transparent 38%);background-size:14cqw 14cqw}
.p4{background-image:repeating-radial-gradient(circle at 50% 108%,transparent 0 7cqw,var(--b) 7cqw 14cqw)}
.p5{background-image:radial-gradient(circle at 50% 100%,transparent 0 32%,var(--b) 33% 68%,transparent 70%);background-size:22cqw 11cqw}
.p6{background-image:repeating-linear-gradient(90deg,var(--b) 0 5cqw,transparent 5cqw 12cqw)}

/* polaroid */
.pola{background:#FBF7F0;padding:10px 10px 14px;border:1px solid var(--line);box-shadow:2px 6px 18px -6px rgba(63,25,33,.45);display:block;text-decoration:none;position:relative;transition:transform .35s var(--ease);max-width:100%}
.pola svg{display:block;width:100%;height:auto}
.pola figcaption,.pola .cap{font:italic 500 17px/1.2 var(--display);padding-top:10px;text-align:center}
.pola::before{content:"";position:absolute;top:-11px;left:50%;width:74px;height:22px;translate:-50% 0;rotate:-3deg;background:rgba(142,109,6,.35);border-left:1px dashed rgba(63,25,33,.25);border-right:1px dashed rgba(63,25,33,.25)}

/* sections */
main{display:block;min-height:60vh}
.view{animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
section.sec{padding-block:48px;border-top:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.sec-h h2{font-size:clamp(30px,4vw,44px)}
.sec-h h2 em,.hero h1 em{font-weight:500}
.sec-h p{color:var(--ink-2);max-width:56ch;margin-top:8px}
.more{font-weight:600;text-underline-offset:4px}

/* hero finder */
.hero{padding-block:34px 44px}
.hero h1{font-size:clamp(42px,8.2vw,112px);margin:10px 0 26px;letter-spacing:-.03em}
.circ{position:relative;display:inline-block;font-style:italic;white-space:nowrap;padding-inline:.12em}
.circ svg{position:absolute;inset:-6% -5% -12%;width:110%;height:118%;overflow:visible;pointer-events:none}
.circ ellipse{fill:none;stroke:var(--orange);stroke-width:3;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s .15s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.finder{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:16px 0;border-block:1.5px solid var(--ink)}
.finder .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count{margin:16px 0 4px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:64px minmax(180px,280px) 1fr;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.row .poster{width:64px}
.row h3{font-size:22px}
.row h3 a{text-decoration:none}
.row h3 a:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.row .by{color:var(--ink-2);font-size:14.5px;margin:2px 0 7px}
.row .tks{flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;min-width:0}
.row .allp{align-self:center;flex:none;font-weight:600;font-size:14px;white-space:nowrap;padding-right:6px}
@media(max-width:820px){.row{grid-template-columns:56px 1fr}.row .poster{width:56px}.row .tks{grid-column:1/-1}}
.empty{padding:36px 0;display:grid;gap:14px;justify-items:start}
.empty h3{font-size:28px;font-style:italic;font-weight:500}
.legend{margin-top:14px;font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}

/* feature */
.feat{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px}
.feat-a{display:grid;grid-template-columns:minmax(140px,240px) 1fr;gap:28px;align-items:center;background:var(--paper-2);border:1.5px solid var(--ink);border-radius:16px;padding:26px}
.feat-a h3{font-size:clamp(30px,3.6vw,48px);margin:8px 0 6px}
.feat-a blockquote,.quote{margin:16px 0;font:italic 500 20px/1.35 var(--display)}
.feat-a cite,.quote cite{display:block;font:500 12.5px var(--mono);font-style:normal;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-top:8px}
.feat-b{background:var(--blue);border:1.5px solid var(--ink);border-radius:16px;padding:26px;display:grid;gap:12px;align-content:start}
.feat-b h3{font-size:32px}
.feat-b .mono{color:var(--ink)}
@media(max-width:980px){.feat{grid-template-columns:1fr}}
@media(max-width:560px){.feat-a{grid-template-columns:1fr}.feat-a .poster{width:150px}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 24px}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}}
.card{position:relative;display:grid;gap:10px;align-content:start}
.card .poster{transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.card:hover .poster{transform:translateY(-5px) rotate(-1.2deg);box-shadow:6px 9px 0 var(--ink)}
.card h3{font-size:21px}
.card h3 a{text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0}
.card .by{font-size:14.5px;color:var(--ink-2)}
.card .meta{font:500 12.5px/1.5 var(--mono);color:var(--ink);border-top:1px dashed var(--ink);padding-top:8px}
.card .meta b{color:var(--orange-ink);font-weight:500}
.bm{position:absolute;z-index:2;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper-2);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.bm:hover{transform:scale(1.1)}
.bm svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2}
.bm[aria-pressed=true]{background:var(--orange-ink)}
.bm[aria-pressed=true] svg{fill:var(--paper-2);stroke:var(--paper-2)}
.bm.popped{animation:bmpop .45s var(--ease)}
@keyframes bmpop{40%{transform:scale(1.35) rotate(-10deg)}}
.bm.inline{position:static;flex:none}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media(max-width:760px){.stage{grid-template-columns:1fr}}
.stage .card{grid-template-columns:minmax(96px,150px) 1fr;gap:20px;background:var(--paper-2);border:1.5px solid var(--ink);border-radius:16px;padding:20px;align-items:center}
.stage .card h3{font-size:28px}
.stage .card .txt{display:grid;gap:8px}

/* specials */
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
@media(max-width:860px){.spec{grid-template-columns:1fr}}
.sp{display:grid;grid-template-columns:86px 1fr auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.sp .d{font-family:var(--display);text-align:center;line-height:1}
.sp .d b{display:block;font-size:40px;font-weight:600}
.sp .d span{font:500 12.5px var(--mono);text-transform:uppercase;letter-spacing:.05em}
.sp h3{font-size:22px;margin:6px 0 2px}
.sp p{font-size:14.5px;color:var(--ink-2)}
@media(max-width:520px){.sp{grid-template-columns:64px 1fr}.sp .tk{grid-column:1/-1;justify-self:start}}

/* cycles, picks, venues */
.cyc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media(max-width:860px){.cyc{grid-template-columns:1fr}}
.cy{border:1.5px solid var(--ink);border-radius:16px;padding:22px;display:grid;gap:10px;align-content:start;color:var(--ink)}
.cy h3{font-size:28px}
.cy h3 a{text-decoration:none}
.cy ul{margin:0;padding:0;list-style:none;font-size:15px}
.cy li{padding:5px 0;border-top:1px dashed var(--ink)}
.cy .foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
@media(max-width:860px){.picks{grid-template-columns:1fr}}
.pick{border-top:1.5px solid var(--ink);padding-top:16px}
.pick .quote{margin:0 0 12px;font-size:21px}
.pick a{font-weight:700}
.venues{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 30px}
@media(max-width:860px){.venues{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.venues{grid-template-columns:1fr}}
.ven{display:grid;gap:14px;align-content:start}
.ven:nth-child(odd) .pola{rotate:-1.6deg}.ven:nth-child(even) .pola{rotate:1.3deg}
.ven:hover .pola{transform:rotate(1.5deg) scale(1.02)}
.ven p{font-size:15px;color:var(--ink-2)}
.fbtn{display:inline-flex;gap:7px;align-items:center;background:none;border:1.5px solid var(--ink);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14.5px;transition:background .2s,color .2s}
.fbtn:hover{background:var(--paper-3)}
.fbtn[aria-pressed=true]{background:var(--ink);color:var(--paper-2)}
.carnet{background:var(--rasp);color:var(--paper);border-radius:18px;padding:34px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
.carnet h2{font-size:clamp(30px,4vw,46px)}
.carnet p{margin-top:12px;max-width:52ch}
.carnet ul{list-style:none;margin:0;padding:0;font:500 14px/1.5 var(--mono)}
.carnet li{padding:10px 0;border-top:1px dashed var(--paper);display:flex;justify-content:space-between;gap:12px}
@media(max-width:760px){.carnet{grid-template-columns:1fr;padding:24px}}

/* detail pages */
.crumb{padding-block:20px 0;font-size:14.5px}

 if(b.step===2){if(v.free)body=`<h1>${tr('Placement libre','Free seating')}</h1><p class="sub">${tr("Dans cette salle, on choisit son fauteuil en entrant.",'In this venue you choose your seat when you walk in.')}</p><p class="note">${tr(`Vos ${n>1?n+' places sont garanties':'place est garantie'}. Les portes ouvrent 20 minutes avant la séance : arrivez à ${fmtT(s.t-20)} pour choisir tranquillement.`,`Your ${n>1?n+' seats are':'seat is'} guaranteed. Doors open 20 minutes before: arrive at ${fmtT(s.t-20)} to choose at your own pace.`)}</p>${v.acc?`<p class="note">${tr('Emplacements fauteuil roulant au dernier rang, accès de plain-pied.','Wheelchair spaces in the back row, step-free access.')}</p>`:''}`;
  else{let m='';'ABCDEFGH'.split('').forEach((r,ri)=>{m+=`<div class="r"><span>${r}</span>`;for(let c=1;c<=10;c++){const id=r+c,tk=taken(s,ri*10+c),on=b.seats.includes(id);m+=`<button class="seat" data-act="seat" data-v="${id}" aria-pressed="${on}" ${tk?'disabled':''} aria-label="${tr('Place','Seat')} ${id}${tk?tr(' occupée',' taken'):''}">${c}</button>`}m+='</div>'});
   body=`<h1>${tr('Choisissez vos places','Choose your seats')}</h1><p class="sub" aria-live="polite">${b.seats.length} / ${n} ${tr('sélectionnée(s)','selected')}</p><div class="scr">${tr('Scène','Stage')}</div><div class="map">${m}</div><p class="legend"><span class="seat" style="width:20px;display:inline-block"></span>${tr('Libre','Free')}<span class="seat" aria-pressed="true" style="width:20px;display:inline-block"></span>${tr('Votre choix','Your choice')}<span class="seat" style="width:20px;display:inline-block;background:var(--paper-3);border-color:var(--line)"></span>${tr('Occupée','Taken')}</p>`}
  body+=`<div class="bnav"><button class="btn" data-act="next" ${v.free||b.seats.length===n?'':'disabled'}>${tr('Continuer','Continue')}</button><button class="btn ghost sm" data-act="step" data-v="1">${tr('Retour','Back')}</button></div>`}
 if(b.step===3)body=`<h1>${tr('Vérifiez avant de payer','Check before you pay')}</h1><p class="sub">${tr('Tout ce que vous paierez est sur cette page.','Everything you will pay is on this page.')}</p><dl class="facts" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><div><dt>${w.type==='cinema'?'Film':tr('Pièce','Play')}</dt><dd>${esc(w.t)} · ${dur(w.dur)}</dd></div><div><dt>${tr('Quand','When')}</dt><dd>${fmtDay(s.d)}, ${fmtT(s.t)} → ≈ ${fmtT(endT(s))}</dd></div><div><dt>${tr('Où','Where')}</dt><dd>${esc(v.name)}, ${esc(s.room)}<br>${esc(v.addr)}</dd></div><div><dt>Version</dt><dd>${L(VERT[s.ver])}</dd></div><div><dt>${tr('Places','Seats')}</dt><dd>${n} · ${v.free?tr('placement libre','free seating'):b.seats.join(', ')}</dd></div><div><dt>Total ${tr('TTC','incl. tax')}</dt><dd>${fmtP(tot)} · ${tr('0 € de frais','€0 fees')}</dd></div></dl><p class="note">${tr("Échange gratuit jusqu'à 2h avant la séance depuis votre e-billet. Remboursement intégral et automatique si la salle annule.","Free exchange up to 2 hours before, from your e-ticket. Full, automatic refund if the venue cancels.")}</p><div class="bnav"><button class="btn" data-act="next">${tr('Passer au paiement','Go to payment')}</button><button class="btn ghost sm" data-act="step" data-v="2">${tr('Retour','Back')}</button></div>`;
 if(b.step===4)body=`<h1>${tr('Paiement','Payment')}</h1><p class="sub">${tr('Montant débité :','Amount charged:')} <b>${fmtP(tot)}</b>. ${tr('Rien de plus.','Nothing more.')}</p><div class="pay" role="radiogroup" aria-label="${tr('Moyen de paiement','Payment method')}">
   <label><input type="radio" name="pay" id="pay-card" value="card" ${b.pay==='card'?'checked':''}><span><b>${tr('Carte bancaire','Bank card')}</b><small>${tr("Formulaire sécurisé Stripe. Votre numéro de carte ne transite jamais par Strapontin et n'est pas conservé.","Secure Stripe form. Your card number never passes through Strapontin and is not stored.")}</small></span></label>
   <label><input type="radio" name="pay" id="pay-pass" value="pass" ${b.pay==='pass'?'checked':''}><span><b>Pass Culture</b><small>${tr('15–18 ans. Vous validez la réservation dans votre application Pass Culture.','Ages 15–18. You confirm the booking in your Pass Culture app.')}</small></span></label>
   ${v.p.carnet&&b.qty.carnet?`<label><input type="radio" name="pay" id="pay-carnet" value="carnet" ${b.pay==='carnet'?'checked':''}><span><b>${tr('Carnet Strapontin','Strapontin carnet')}</b><small>${tr('Vos places carnet sont décomptées de votre carnet en cours.','Your carnet tickets are deducted from your current book.')}</small></span></label>`:''}</div>
   <p class="note"><b>${tr('Prototype','Prototype')}</b> · ${tr("Aucun paiement réel. Ici s'affichera le formulaire hébergé par Stripe (carte, 3-D Secure).",'No real payment. The Stripe-hosted form (card, 3-D Secure) would appear here.')}</p>
   <div class="bnav"><button class="btn" data-act="pay">${tr('Payer','Pay')} ${fmtP(tot)}</button><button class="btn ghost sm" data-act="step" data-v="3">${tr('Retour','Back')}</button></div>`;
 if(b.step===5){let qr='';for(let i=0;i<169;i++){const r=Math.floor(i/13),c=i%13,cor=(r<3&&c<3)||(r<3&&c>9)||(r>9&&c<3);qr+=`<i class="${cor||((i*i*7+s.t+i*s.w)%3===0)?'':'o'}"></i>`}
  body=`<h1>${tr('C’est réservé.','You’re booked.')}</h1><p class="sub">${tr('Présentez ce billet à l’entrée, sur votre téléphone ou imprimé.','Show this ticket at the door, on your phone or printed.')}</p>
  <div class="eticket"><div class="a"><p class="mono">${esc(v.name)} · ${esc(s.room)}</p><h2>${esc(w.t)}</h2><p><b>${fmtDay(s.d)}</b> · ${fmtT(s.t)} → ≈ ${fmtT(endT(s))}</p><div class="tags">${verTag(s.ver,w)}${s.kind?`<span class="tag kind">${L(KIND[s.kind])}</span>`:''}</div><p style="font-size:14.5px">${esc(v.addr)}<br>${esc(v.metro)}</p></div>
  <div class="b"><div class="qr" role="img" aria-label="${tr('Code du billet (spécimen)','Ticket code (specimen)')}">${qr}</div><div><p class="mono">${tr('Réservation','Booking')} ${b.ref}</p><p><b>${n} ${n>1?tr('places','seats'):tr('place','seat')}</b> · ${v.free?tr('placement libre','free seating'):b.seats.join(', ')}</p><p>${fmtP(tot)} ${tr('TTC','incl. tax')}</p><p class="mono">${tr('Spécimen','Specimen')}</p></div></div></div>
  <p class="note" style="max-width:400px;margin-top:22px"><b>${tr('Avant ou après la séance','Before or after')}</b><br>${L(v.bar)}</p>
  <div class="bnav">${fbtn(v.id,tr('cette salle','this venue'))}<a class="btn ghost sm" href="#home">${tr("Retour à l'accueil",'Back to home')}</a></div>`}
 return `<div class="view wrap">${steps}<div class="book"><div>${body}</div>${b.step<5?side:''}</div></div>`}

/* ---------- drawer, toast, cookie ---------- */
function layer(){const saved=S.list.map(id=>W[wi(id)]).filter(Boolean),fv=S.follow.map(id=>V[vi(id)]).filter(Boolean),fc=S.follow.map(id=>CYC.find(c=>c.id===id)).filter(Boolean);
 let h='';
 if(S.drawer)h+=`<div class="scrim" data-act="drawer-close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${tr('Ma liste','My list')}"><header><h2>${tr('Ma <em>liste</em>','My <em>list</em>')}</h2><button class="x" data-act="drawer-close" aria-label="${tr('Fermer','Close')}" id="dx">×</button></header>
  <div><h3>${tr('À voir','To see')} (${saved.length})</h3>${saved.length?saved.map(w=>{const nx=ALL.find(s=>W[s.w]===w&&up(s));return `<div class="it">${poster(w)}<div><a href="#film-${w.id}" data-act="drawer-close">${esc(w.t)}</a><small>${nx?`${tr('Prochaine séance','Next')} : ${dayShort(nx.d)} ${fmtT(nx.t)} · ${esc(V[nx.v].name)}`:tr('Pas de séance cette semaine','No screenings this week')}</small></div><button class="x" data-act="save" data-id="${w.id}" aria-label="${tr('Retirer','Remove')}">×</button></div>`}).join(''):`<p style="color:var(--ink-2)">${tr('Touchez le signet sur une affiche pour garder un film de côté.','Tap the bookmark on a poster to keep a film for later.')}</p>`}</div>
  <div><h3>${tr('Salles et cycles suivis','Followed venues and seasons')} (${fv.length+fc.length})</h3>${fv.map(v=>`<div class="it" style="grid-template-columns:1fr auto"><div><a href="#salle-${v.id}" data-act="drawer-close">${esc(v.name)}</a><small>${v.arr} · ${esc(v.q)}</small></div><button class="x" data-act="follow" data-id="${v.id}" aria-label="${tr('Ne plus suivre','Unfollow')}">×</button></div>`).join('')}${fc.map(c=>`<div class="it" style="grid-template-columns:1fr auto"><div><a href="#cycle-${c.id}" data-act="drawer-close">${L(c.t)}</a><small>Cycle</small></div><button class="x" data-act="follow" data-id="${c.id}" aria-label="${tr('Ne plus suivre','Unfollow')}">×</button></div>`).join('')}${fv.length+fc.length?'':`<p style="color:var(--ink-2)">${tr('Suivez une salle ou un cycle : nous vous prévenons quand une séance est ajoutée, jamais plus d’une fois par semaine.','Follow a venue or a season: we tell you when a screening is added, never more than once a week.')}</p>`}</div>
  <p class="note">${tr('Votre liste est enregistrée sur cet appareil. Créez un compte pour la retrouver partout et recevoir vos alertes par e-mail.','Your list is saved on this device. Create an account to find it everywhere and get your alerts by email.')}</p></aside>`;
 if(S.cookie===null)h+=`<div class="cookie" role="region" aria-label="Cookies"><div class="wrap"><p>${tr("Nous utilisons des cookies strictement nécessaires au fonctionnement du site et, avec votre accord, des cookies de mesure d'audience.","We use cookies that are strictly necessary for the site to work and, with your consent, audience measurement cookies.")}</p><div class="two"><button data-act="cookie" data-v="no">${tr('Refuser','Decline')}</button><button data-act="cookie" data-v="yes">${tr('Accepter','Accept')}</button></div></div></div>`;
 $('#layer').innerHTML=h+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
 const n=$('#listn');if(n)n.textContent=S.list.length+S.follow.length}
let tt;function toast(m){S.toast=m;layer();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';const e=$('.toast');if(e)e.remove()},2600)}

/* ---------- router ---------- */
function parse(){const h=location.hash.slice(1);let m;
 if((m=h.match(/^film-(.+)$/))&&wi(m[1])>-1)return{n:'film',id:m[1]};
 if((m=h.match(/^salle-(.+)$/))&&vi(m[1])>-1)return{n:'salle',id:m[1]};
 if((m=h.match(/^cycle-(.+)$/))&&CYC.some(c=>c.id===m[1]))return{n:'cycle',id:m[1]};
 if(m=h.match(/^reserver-(.+)$/))return{n:'book',id:m[1]};
 return{n:'home'}}
function view(){const r=S.route;return r.n==='film'?film(W[wi(r.id)]):r.n==='salle'?venue(V[vi(r.id)]):r.n==='cycle'?cycle(CYC.find(c=>c.id===r.id)):r.n==='book'?booking():home()}
function paint(keep){const y=scrollY;$('#main').innerHTML=view();if(keep){const v=$('.view');if(v)v.style.animation='none';scrollTo({top:y,behavior:'instant'})}}
let pending=null;
function route(){const r=parse(),same=JSON.stringify(r)===JSON.stringify(S.route);S.route=r;
 if(r.n==='book'&&(!S.bk||S.bk.sid!==r.id))S.bk={sid:r.id,step:1,qty:{full:1,red:0,child:0,carnet:0},seats:[],pay:'card',ref:''};
 if(r.n==='film'&&!same){S.fday=0;S.fver='all';S.fmom='all';S.facc=false;const k=wi(r.id),f=ALL.find(s=>s.w===k&&up(s));if(f)S.fday=f.d}
 if(r.n==='salle'&&!same)S.vday=0;
 const go=()=>{paint(false);const a=pending;pending=null;if(a&&document.getElementById(a))document.getElementById(a).scrollIntoView({behavior:'instant',block:'start'});else scrollTo({top:0,behavior:'instant'})};
 if(same&&pending){const el=document.getElementById(pending);pending=null;if(el)el.scrollIntoView({behavior:'smooth'});return}
 if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const vt=document.startViewTransition(go);[vt.ready,vt.finished,vt.updateCallbackDone].forEach(p=>p&&p.catch(()=>{}))}else go();
 document.title=r.n==='home'?'Strapontin':(r.n==='film'?W[wi(r.id)].t:r.n==='salle'?V[vi(r.id)].name:r.n==='cycle'?L(CYC.find(c=>c.id===r.id).t):tr('Réserver','Book'))+' · Strapontin'}
function part(id,html){const e=document.getElementById(id);if(e)e.innerHTML=html}

/* ---------- search ---------- */
function searchIndex(){return[...W.map(w=>({g:w.type==='cinema'?tr('Films','Films'):tr('Pièces','Plays'),t:w.t,s:w.by,k:norm(w.t+' '+w.by+' '+w.cast),h:'#film-'+w.id})),...CYC.map(c=>({g:tr('Cycles & rétrospectives','Seasons'),t:L(c.t),s:c.w.length+' films',k:norm(c.t.fr+' '+c.t.en+' '+c.d.fr+' '+c.w.map(id=>W[wi(id)].by).join(' ')),h:'#cycle-'+c.id})),...V.map(v=>({g:tr('Salles','Venues'),t:v.name,s:v.arr+' · '+v.q,k:norm(v.name+' '+v.q+' '+v.arr+' '+v.rooms.join(' ')),h:'#salle-'+v.id}))]}
let acSel=-1;
function ac(){const q=norm(S.q.trim()),box=$('#acbox'),inp=$('#q');if(!q){box.innerHTML='';inp.setAttribute('aria-expanded','false');return}
 const res=searchIndex().filter(x=>x.k.includes(q)).slice(0,9),hl=t=>{const i=norm(t).indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))};
 let g='',h='';res.forEach((x,i)=>{if(x.g!==g){g=x.g;h+=`<h4>${g}</h4>`}h+=`<a href="${x.h}" role="option" id="ac${i}" aria-selected="${i===acSel}"><span>${hl(x.t)}</span><small>${hl(x.s)}</small></a>`});
 box.innerHTML=`<div class="ac" id="ac" role="listbox">${h||`<p class="none">${tr('Aucun résultat pour','No results for')} « ${esc(S.q)} ». ${tr('Essayez un titre, un·e cinéaste, un quartier.','Try a title, a director, a neighbourhood.')}</p>`}</div>`;inp.setAttribute('aria-expanded','true')}
const closeAc=()=>{S.q='';acSel=-1;const i=$('#q');if(i)i.value='';ac()};

/* ---------- events ---------- */
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;acSel=-1;ac()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.drawer){S.drawer=false;layer()}closeAc()}
 if(e.target.id==='q'){const items=[...document.querySelectorAll('#ac a')];if(!items.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();acSel=(acSel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((a,i)=>a.setAttribute('aria-selected',i===acSel));e.target.setAttribute('aria-activedescendant','ac'+acSel)}
  if(e.key==='Enter'){e.preventDefault();location.hash=(items[acSel<0?0:acSel]).getAttribute('href');closeAc();e.target.blur()}}});
document.addEventListener('change',e=>{const a=e.target.dataset.act;
 if(a==='arr'){S.arr=e.target.value;part('finder',finderHTML());const s=$('#f-arr');if(s)s.focus()}
 if(a==='facc'){S.facc=e.target.checked;part('fsess',filmSessions(W[wi(S.route.id)]))}
 if(e.target.name==='pay'&&S.bk)S.bk.pay=e.target.value});
document.addEventListener('click',e=>{
 if(e.target.id==='skip'){e.preventDefault();$('#main').focus();$('#main').scrollIntoView();return}
 if(!e.target.closest('.search'))closeAc();
 const sc=e.target.closest('[data-scroll]');
 if(sc){const id=sc.dataset.scroll,target=sc.getAttribute('href');if(('#'+(location.hash.slice(1)||'home'))===target||(target==='#home'&&S.route.n==='home')){e.preventDefault();const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth'})}else pending=id;return}
 const acA=e.target.closest('#ac a');if(acA){setTimeout(closeAc,0);return}
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v,b=S.bk;
 const refocus=sel=>{const x=$(sel);if(x)x.focus({preventScroll:true})};
 if(a==='lang'){S.lang=v;store.set('lang',v);renderChrome();paint(true);layer();bindScroll()}
 if(a==='when'||a==='ver'){S[a]=v;part('finder',finderHTML());if(a==='when'){const c=$('#circ');c.firstChild.textContent=WHEN().find(x=>x[0]===v)[2];const el2=$('ellipse',c);el2.style.animation='none';el2.getBoundingClientRect();el2.style.animation=''}refocus(`#finder [data-act="${a}"][data-v="${v}"]`)}
 if(a==='fday'||a==='fver'||a==='fmom'){S[a]=a==='fday'?+v:v;part('fsess',filmSessions(W[wi(S.route.id)]));refocus(`#fsess [data-act="${a}"][data-v="${v}"]`)}
 if(a==='freset'){S.fver='all';S.fmom='all';S.facc=false;part('fsess',filmSessions(W[wi(S.route.id)]))}
 if(a==='vday'){S.vday=+v;part('vprog',venueProg(V[vi(S.route.id)]));refocus(`#vprog [data-act="vday"][data-v="${v}"]`)}
 if(a==='save'||a==='follow'){e.preventDefault();const id=el.dataset.id,arr=a==='save'?S.list:S.follow,i=arr.indexOf(id);if(i>-1)arr.splice(i,1);else arr.push(id);store.set(a==='save'?'list':'follow',arr);
  document.querySelectorAll(`[data-act="${a}"][data-id="${id}"]`).forEach(x=>{if(x.closest('.drawer'))return;x.setAttribute('aria-pressed',i<0);if(x.classList.contains('bm')){x.classList.remove('popped');x.getBoundingClientRect();if(i<0)x.classList.add('popped')}else if(a==='save')x.textContent=i<0?'✓ '+tr('Dans ma liste','In my list'):'+ '+tr('Ajouter à ma liste','Add to my list');else x.textContent=i<0?'✓ '+tr('Suivi','Following'):'+ '+tr('Suivre','Follow')});
  toast(a==='save'?(i<0?tr('Ajouté à votre liste','Added to your list'):tr('Retiré de votre liste','Removed from your list')):(i<0?tr('Suivi. Nous vous prévenons des nouvelles séances.','Following. We’ll tell you about new screenings.'):tr('Vous ne suivez plus','Unfollowed')))}
 if(a==='drawer'){S.drawer=true;layer();refocus('#dx')}
 if(a==='drawer-close'){S.drawer=false;layer()}
 if(a==='cookie'){S.cookie=v;store.set('cookie',v);layer();toast(v==='yes'?tr('Cookies de mesure acceptés','Measurement cookies accepted'):tr('Cookies de mesure refusés','Measurement cookies declined'))}
 if(a==='cookie-open'){S.cookie=null;layer()}
 if(!b)return;
 if(a==='qty'){const k=el.dataset.k;b.qty[k]=Math.max(0,b.qty[k]+ +v);b.seats=[];paint(true);refocus(`[data-act="qty"][data-k="${k}"][data-v="${v}"]:not(:disabled)`)}
 if(a==='seat'){const i=b.seats.indexOf(v);if(i>-1)b.seats.splice(i,1);else{if(b.seats.length>=bkN())b.seats.shift();b.seats.push(v)}paint(true);refocus(`[data-act="seat"][data-v="${v}"]`)}
 if(a==='step'||a==='next'){b.step=a==='next'?b.step+1:+v;paint(false);scrollTo({top:0,behavior:'smooth'});$('#main').focus({preventScroll:true})}
 if(a==='pay'){el.disabled=true;el.textContent=tr('Paiement en cours…','Processing…');setTimeout(()=>{b.ref='STR-'+(b.sid.replace(/x/g,'')*7%1e6).toString(36).toUpperCase().padStart(4,'7');b.step=5;paint(false);scrollTo({top:0,behavior:'smooth'});toast(tr('Réservation confirmée','Booking confirmed'))},900)}
});
function bindScroll(){const hd=$('#hd');const f=()=>hd.classList.toggle('scrolled',scrollY>8);f();window.onscroll=f}
window.addEventListener('hashchange',route);
renderChrome();route();layer();bindScroll();
</script>
